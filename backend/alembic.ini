# Alembic configuration for local single-machine SQLite deployment.
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding on Windows (GBK here), so non-ASCII comments break parsing.
# The database URL is NOT defined here; alembic/env.py injects it from app config.

[alembic]
# Migration scripts directory (relative to this file)
script_location = alembic

# Migration file name template: timestamp + revision + slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
