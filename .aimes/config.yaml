schema_version: 1
governance:
  name: AIMES
  version: '1.2'
  core: docs/_governance/AIMES-CORE-V1.2.md
project:
  root: .
  name: lexitype-academy
  scope: project
tools:
- id: trae-code
  name: Trae Code
  adapter_status: template
  entry_paths:
  - .trae/rules/00-aimes-governance.md
- id: vscode-codex
  name: VS Code + Codex
  adapter_status: template
  entry_paths:
  - AGENTS.md
- id: vscode-claude-code
  name: VS Code + Claude Code
  adapter_status: template
  entry_paths:
  - CLAUDE.md
- id: vscode-copilot
  name: VS Code + GitHub Copilot
  adapter_status: template
  entry_paths:
  - .github/copilot-instructions.md
- id: zcode
  name: ZCode
  adapter_status: manual
  entry_paths:
  - .aimes/adapters/zcode/README.md
- id: qcode
  name: QCode
  adapter_status: manual
  entry_paths:
  - .aimes/adapters/qcode/README.md
- id: claude-code
  name: Claude Code CLI
  adapter_status: template
  entry_paths:
  - CLAUDE.md
- id: codex-cli
  name: Codex CLI
  adapter_status: template
  entry_paths:
  - AGENTS.md
policy:
  preserve_existing_files: true
  auto_overwrite: false
  unknown_capability: report-and-stop
  verified_requires_evidence: true
records:
  tasks: project-control/TASKS.md
  handoff: project-control/HANDOFF.md
